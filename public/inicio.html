<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estaci贸n Meteorol贸gica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Fija tu backend en Railway -->
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    position: relative;
    transition: background-color 1s;
    background: linear-gradient(135deg, #202c3b, #2d3e50);
    font-family: 'Orbitron', sans-serif;
  }
  .top-right-button {
    background: #00bfff;
    color: #000;
    padding: 10px 15px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 5px rgba(0, 191, 255, 0.5);
  }
  .weather-screen {
    background: #000;
    color: #00bfff;
    padding: 20px;
    border-radius: 10px;
    width: 90%;
    max-width: 500px;
    text-align: center;
    margin-bottom: 20px;
  }
  .data-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
    margin-top: 10px;
  }
  .data-box {
    background: rgba(255, 255, 255, 0.1);
    padding: 16px;
    border-radius: 8px;
    text-align: center;
    min-height: 90px;
    box-shadow: 0 0 6px rgba(0, 191, 255, 0.5);
  }
  .label {
    font-size: 1rem;
    font-weight: bold;
  }
  .value {
    font-size: 1.6rem;
    font-weight: bold;
    margin-top: 5px;
  }
  #spinner-mes {
    display: none;
    margin: 10px auto;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #00bfff;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>

</head>
<body class="px-2 sm:px-4">
  <header class="w-full max-w-3xl flex items-center justify-between gap-3 mb-4"><h1 class="text-4xl font-bold text-white">ALFARNATE</h1><div class="flex gap-2"><span id="usuario-actual" class="text-white self-center text-sm"></span><button id="cerrar-sesion" class="top-right-button">Cerrar sesi贸n</button></div></header>

  <div class="weather-screen">
    <h1 class="text-2xl font-bold">馃摗 Estaci贸n Meteorol贸gica SANCHEZ MORENO</h1>
    <div class="data-grid">

      <!-- Tarjeta: Lluvia acumulada (A脩O ACTUAL) -->
      <div class="bg-slate-800/60 backdrop-blur rounded-2xl p-4 shadow-lg border border-slate-700 w-full max-w-xs">
        <div class="text-slate-300 text-sm">Lluvia acumulada</div>
        <div id="total-lluvia" class="text-4xl font-extrabold text-cyan-300 mt-1">--</div>
        <div id="total-lluvia-rango" class="text-slate-400 text-xs mt-1">(a帽o actual)</div>
      </div>

      <div class="data-box"><p class="label">馃尅锔?Temperatura</p><p class="value" id="temperature">--</p></div>
      <div class="data-box"><p class="label">馃挧 Humedad</p><p class="value" id="humidity">--</p></div>
      <div class="data-box"><p class="label">馃挩 Viento</p><p class="value" id="wind-speed">--</p></div>
      <div class="data-box"><p class="label">馃Л Direcci贸n</p><p class="value" id="wind-dir">--</p></div>
      <div class="data-box"><p class="label">馃導锔?Lluvia</p><p class="value" id="rainfall">--</p></div>
      <div class="data-box"><p class="label">馃實 Presi贸n</p><p class="value" id="pressure">--</p></div>
      <div class="data-box"><p class="label">鈽€锔?脥ndice UV</p><p class="value" id="uv-index">--</p></div>
      <div class="data-box"><p class="label">馃晵 Hora</p><p class="value" id="time">--</p></div>
    </div>
    <p id="error-message" class="text-red-500 text-sm mt-2 hidden"></p>
  </div>

  <div class="weather-screen">
    <h2 class="text-xl font-bold mb-4">馃敭 Pron贸stico de 7 d铆as</h2>
    <div id="forecast" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 text-left text-sm sm:text-base"></div>
  </div>

  <!-- Selector y gr谩fico mensual -->
  <div class="weather-screen">
    <h2 class="text-xl font-bold mb-2">馃搮 Lluvia mensual (CumulusMX)</h2>
    <input id="mes-selector" type="month" class="text-black p-1 rounded mb-2"/>
    <button id="boton-mes" class="top-right-button">Calcular</button>
    <div id="spinner-mes"></div>
    <p id="resultado-mes" class="mt-2"></p>
    <canvas id="grafico-lluvia" width="400" height="200"></canvas>
  </div>

  <!-- Bot贸n historial -->
  <div class="weather-screen">
    <button id="btn-historial" class="top-right-button mt-4 w-full sm:w-auto">馃搳 Ver Historial</button>
  </div>

  <!-- Overlay por sesi贸n cerrada -->
<script>
    // =========================
    //  CONFIGURACI脫N DE BACKEND
    // =========================
    (function initApiBase(){
      const meta = document.querySelector('meta[name="rail-api-base"]');
      const fromMeta = meta && meta.getAttribute('content') || '';
      window.RAIL_API_BASE =
        (fromMeta && fromMeta.trim()) ||
        (window.RAIL_API_BASE && String(window.RAIL_API_BASE)) ||
        (location.origin && String(location.origin)) ||
        'https://produccion-alemana-d2b4.up.railway.app';
    })();

    const FETCH_OPTS = { cache: 'no-store', credentials: 'include' };

    async function fetchWeatherData() {
      const em = document.getElementById('error-message');
      try {
        const res = await fetch(`${window.RAIL_API_BASE}/api/cumulus/current`, FETCH_OPTS);
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.datos) throw new Error(data.detalle || data.error || `HTTP ${res.status}`);
        const d = data.datos;
        const set = (id, value, suffix = '') => {
          const el = document.getElementById(id);
          if (el) el.textContent = value === null || value === undefined || value === '' ? '--' : `${value}${suffix}`;
        };
        set('temperature', d.temperatura, ' °C');
        set('humidity', d.humedad, ' %');
        set('wind-speed', d.viento, ' km/h');
        set('wind-dir', d.direccion, '°');
        set('rainfall', d.lluviaHoy, ' mm');
        set('pressure', d.presion, ' hPa');
        set('uv-index', d.uv);
        set('time', d.hora || d.recibido || '--');
        if (em) em.classList.add('hidden');
      } catch (err) {
        if (em) {
          em.textContent = 'No llegan datos actuales de CumulusMX. Comprueba que el agente cumulus-sender está ejecutándose en el PC.';
          em.classList.remove('hidden');
        }
        console.error('Error al cargar datos actuales de CumulusMX:', err);
      }
    }

    async function fetchForecast() {
      // Si prefieres, tambi茅n puedes proxear Open-Meteo por tu backend
      const lat = 36.985;
      const lon = -4.223;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_min,temperature_2m_max,weathercode,precipitation_probability_max&timezone=auto&forecast_days=7`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const forecastDiv = document.getElementById("forecast");
        const dias = data.daily.time;
        const min = data.daily.temperature_2m_min;
        const max = data.daily.temperature_2m_max;
        const code = data.daily.weathercode;
        const lluvia = data.daily.precipitation_probability_max;
        const desc = {
          0: 'Despejado', 1: 'Mayormente despejado', 2: 'Parcialmente nublado',
          3: 'Nublado', 45: 'Niebla', 48: 'Niebla escarchada',
          51: 'Llovizna ligera', 53: 'Llovizna moderada', 55: 'Llovizna densa',
          61: 'Lluvia ligera', 63: 'Lluvia moderada', 65: 'Lluvia intensa',
          71: 'Nieve ligera', 73: 'Nieve moderada', 75: 'Nieve intensa',
          80: 'Chubascos ligeros', 81: 'Chubascos moderados', 82: 'Chubascos fuertes'
        };
        forecastDiv.innerHTML = '';
        for (let i = 0; i < dias.length; i++) {
          const dia = new Date(dias[i]).toLocaleDateString('es-ES', { weekday: 'long' });
          forecastDiv.innerHTML += `<div><strong>${dia}</strong><br>${desc[code[i]] || 'Clima'}<br>馃尅锔?${min[i]}掳C - ${max[i]}掳C<br>馃導锔?${lluvia[i]}%</div>`;
        }
      } catch (e) {
        document.getElementById("forecast").textContent = "Error al cargar el pron贸stico";
        console.error("Error al obtener pron贸stico:", e);
      }
    }

    function mostrarLluviaAcumuladaPorMes() {
      const mesInput = document.getElementById('mes-selector').value;
      const resultado = document.getElementById('resultado-mes');
      const spinner = document.getElementById('spinner-mes');
      const canvas = document.getElementById('grafico-lluvia');

      if (!mesInput) {
        resultado.textContent = "鈿狅笍 Selecciona un mes v谩lido.";
        return;
      }

      const [year, month] = mesInput.split("-");
      spinner.style.display = "block";
      resultado.textContent = "馃攧 Consultando CumulusMX...";

      fetch(`${window.RAIL_API_BASE}/api/lluvia/mensual?year=${encodeURIComponent(year)}&month=${encodeURIComponent(month)}`, FETCH_OPTS)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
          return res.json();
        })
        .then(data => {
          const total = Number(data?.total_mm);
          if (!Number.isFinite(total)) throw new Error('CumulusMX no devolvi贸 una lluvia v谩lida');

          resultado.textContent = `馃導锔?Lluvia total en ${month}/${year}: ${total.toFixed(2)} mm`;

          // El gr谩fico anterior se alimentaba de Weather Underground.
          // Al cambiar la fuente a CumulusMX no mostramos datos de una fuente distinta.
          if (window.miGrafico) {
            window.miGrafico.destroy();
            window.miGrafico = null;
          }
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        })
        .catch(err => {
          resultado.textContent = "鉂?No se pudo obtener la lluvia de CumulusMX. Comprueba que CumulusMX est谩 activo y que CUMULUS_URL apunta a 茅l.";
          console.error("鈿狅笍 Error al obtener la lluvia mensual desde CumulusMX:", err);
        })
        .finally(() => {
          spinner.style.display = "none";
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
      fetchWeatherData();
      setInterval(fetchWeatherData, 60000);
      fetchForecast();
      const botonMes = document.getElementById("boton-mes");
      if (botonMes) {
        botonMes.addEventListener("click", mostrarLluviaAcumuladaPorMes);
      }
    });

  </script>

  <script>
  // === Cargar total lluvia del a帽o actual desde tu backend ===
  (async function cargarTotalLluviaAnual(){
    const el = document.getElementById('total-lluvia');
    const rangoEl = document.getElementById('total-lluvia-rango');
    if (!el) return;
    try {
      const r = await fetch(`${window.RAIL_API_BASE}/api/lluvia/total/year`, { credentials: 'include', cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const mm = Number(data?.total_mm ?? 0);
      el.textContent = (Number.isFinite(mm) ? mm : 0).toFixed(1) + ' mm';

      if (data?.desde && data?.hasta) {
        rangoEl.textContent = `(del ${data.desde} al ${data.hasta})`;
      } else {
        rangoEl.textContent = '(a帽o actual)';
      }
    } catch (e) {
      console.error(e);
      el.textContent = '--';
      el.title = 'No se pudo cargar la lluvia anual';
    }
  })();
  </script>

<script>
  (function(){
    var btn = document.getElementById('btn-historial');
    if (btn) btn.addEventListener('click', function(){ window.location.href = '/historial.html'; });
  })();
</script>
