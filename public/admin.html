<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar usuarios | ALFARNATE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-900 text-white p-4 md:p-8"><main class="max-w-4xl mx-auto"><header class="flex flex-wrap items-center justify-between gap-3 mb-8"><div><h1 class="text-3xl font-bold text-cyan-300">ALFARNATE</h1><p class="text-slate-300">Administración de usuarios</p></div><div class="flex gap-2"><a href="/inicio" class="rounded-lg bg-cyan-700 px-4 py-2">Ir a la estación</a><button id="logout" class="rounded-lg bg-slate-700 px-4 py-2">Cerrar sesión</button></div></header><section class="bg-slate-800 rounded-xl p-5 mb-6"><h2 class="text-xl font-bold mb-4">Crear usuario</h2><form id="createForm" class="grid md:grid-cols-3 gap-3"><input id="newUsername" placeholder="Nombre de usuario" required minlength="3" maxlength="32" class="rounded p-3 text-slate-900"><select id="newRole" class="rounded p-3 text-slate-900"><option value="user">Usuario</option><option value="admin">Administrador</option></select><button class="rounded bg-cyan-400 text-slate-950 font-bold p-3">Crear</button></form><p id="message" class="mt-3 text-sm" role="status"></p></section><section class="bg-slate-800 rounded-xl p-5"><h2 class="text-xl font-bold mb-4">Usuarios registrados</h2><div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="border-b border-slate-600"><th class="p-2">Usuario</th><th class="p-2">Rol</th><th class="p-2">Acción</th></tr></thead><tbody id="users"></tbody></table></div></section></main><script>
const msg=document.getElementById('message');async function loadUsers(){const r=await fetch('/api/admin/users');if(r.status===401||r.status===403){location.href='/login.html';return;}const d=await r.json();document.getElementById('users').innerHTML='';for(const u of d.users){const tr=document.createElement('tr');tr.className='border-b border-slate-700';const a=document.createElement('td');a.className='p-2';a.textContent=u.username;const b=document.createElement('td');b.className='p-2';b.textContent=u.role==='admin'?'Administrador':'Usuario';const c=document.createElement('td');c.className='p-2';if(u.username.toLowerCase()!=='admin'){const btn=document.createElement('button');btn.textContent='Eliminar';btn.className='rounded bg-red-700 px-3 py-1';btn.onclick=async()=>{if(!confirm('¿Eliminar el usuario '+u.username+'?'))return;const rr=await fetch('/api/admin/users/'+encodeURIComponent(u.username),{method:'DELETE'});if(rr.ok)loadUsers();else alert('No se pudo eliminar el usuario.');};c.appendChild(btn);}else c.textContent='Cuenta protegida';tr.append(a,b,c);document.getElementById('users').appendChild(tr);}}
document.getElementById('createForm').onsubmit=async e=>{e.preventDefault();msg.textContent='Creando…';const r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('newUsername').value,role:document.getElementById('newRole').value})});const d=await r.json();if(!r.ok){msg.textContent=d.error==='user_exists'?'Ese usuario ya existe.':(d.detalle||'No se pudo crear.');return;}msg.textContent='Usuario creado correctamente.';e.target.reset();loadUsers();};
document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login.html';};loadUsers();
</script></body></html>
