<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso | ALFARNATE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen flex items-center justify-center bg-slate-900 text-white p-4"><main class="w-full max-w-md rounded-2xl bg-slate-800 p-8 shadow-2xl border border-cyan-700"><h1 class="text-3xl font-bold text-center text-cyan-300">ALFARNATE</h1><p class="text-center text-slate-300 mt-2 mb-6">Estación meteorológica · Acceso de usuarios</p><form id="loginForm" class="space-y-4"><label class="block">Usuario<input id="username" autocomplete="username" required class="mt-1 w-full rounded-lg p-3 text-slate-900" /></label><button class="w-full rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold p-3">Iniciar sesión</button><p id="error" class="text-red-300 text-sm" role="alert"></p></form><p class="text-xs text-slate-400 mt-6">Introduce tu usuario. Si no estás registrado, contacta con el administrador.</p></main><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='Comprobando…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value})});const d=await r.json();if(!r.ok)throw new Error(r.status===401?'Usuario no registrado. Contacta con el administrador.':(d.detalle||'No se pudo iniciar sesión.'));location.href=d.redirect||'/inicio';}catch(err){error.textContent=err.message;}});</script></body></html>
